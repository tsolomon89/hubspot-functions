version: "2026.03"
project: "hubspot-functions"

propertyGroups:
  - name: "commercial_operations_automation"
    label: "Commercial Operations Automation"
    objectTypes: ["companies", "deals", "contacts"]

properties:
  companies:
    - name: "coa_relationship_key"
      label: "Relationship Key"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      hasUniqueValue: false
      description: "Canonical identity key for Commercial Relationship."

    - name: "coa_relationship_type"
      label: "Relationship Type"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      hasUniqueValue: false
      description: "Relationship Type category (b2b, b2c, partnership, reseller)."

  deals:
    - name: "coa_opportunity_key"
      label: "Opportunity Key"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      hasUniqueValue: true
      description: "Canonical identity key for Opportunity."

    - name: "coa_relationship_key"
      label: "Relationship Key"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      hasUniqueValue: false
      description: "Canonical relationship key."

    - name: "coa_opportunity_type"
      label: "Opportunity Type"
      type: "enumeration"
      fieldType: "select"
      groupName: "commercial_operations_automation"
      options:
        - label: "MQL"
          value: "MQL"
        - label: "SQL"
          value: "SQL"
        - label: "FTP"
          value: "FTP"
        - label: "RTP"
          value: "RTP"
      description: "Universal Opportunity Type (MQL, SQL, FTP, RTP)."

    - name: "coa_cycle_index"
      label: "Cycle Index"
      type: "number"
      fieldType: "number"
      groupName: "commercial_operations_automation"
      description: "Cycle sequence index for RTP opportunities."

    - name: "coa_predecessor_opportunity_key"
      label: "Predecessor Opportunity Key"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      description: "Opportunity key of preceding completed opportunity."

    - name: "coa_qualification_state"
      label: "Qualification State"
      type: "enumeration"
      fieldType: "select"
      groupName: "commercial_operations_automation"
      options:
        - label: "PENDING"
          value: "PENDING"
        - label: "SATISFIED"
          value: "SATISFIED"
        - label: "BLOCKED"
          value: "BLOCKED"
        - label: "MANUAL_REVIEW"
          value: "MANUAL_REVIEW"
      description: "Current qualification state evaluated by commercial kernel."

    - name: "coa_unsatisfied_goal_keys"
      label: "Unsatisfied Goal Keys"
      type: "string"
      fieldType: "textarea"
      groupName: "commercial_operations_automation"
      description: "JSON array of unsatisfied goal keys."

    - name: "coa_last_evaluated_at"
      label: "Last Evaluated At"
      type: "datetime"
      fieldType: "date"
      groupName: "commercial_operations_automation"
      description: "Timestamp of last commercial kernel evaluation."

    - name: "coa_config_version"
      label: "Config Version"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      description: "Version of Organization config evaluated."

    - name: "coa_managed"
      label: "COA Managed"
      type: "bool"
      fieldType: "booleancheckbox"
      groupName: "commercial_operations_automation"
      options:
        - label: "True"
          value: "true"
        - label: "False"
          value: "false"
      description: "Whether record is managed by Commercial Operations Automation."

    - name: "coa_automation_suppressed"
      label: "Automation Suppressed"
      type: "bool"
      fieldType: "booleancheckbox"
      groupName: "commercial_operations_automation"
      options:
        - label: "True"
          value: "true"
        - label: "False"
          value: "false"
      description: "Master kill switch for Commercial Operations Automation."

webhooks:
  targetUrl: "/webhooks/hubspot"
  subscriptions:
    - subscriptionType: "contact.creation"
      enabled: true
    - subscriptionType: "company.creation"
      enabled: true
    - subscriptionType: "deal.creation"
      enabled: true
