version: "2026.03"
project: "hubspot-functions"

propertyGroups:
  - name: "commercial_operations"
    label: "Commercial Operations"
    objectTypes: ["companies", "deals", "contacts"]

properties:
  companies:
    - name: "company_key"
      label: "Company Key"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations"
      hasUniqueValue: true
      description: "Canonical identity key for Company."

  deals:
    - name: "deal_key"
      label: "Deal Key"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations"
      hasUniqueValue: true
      description: "Canonical identity key for Company x Product Deal (companyKey::productKey)."

    - name: "product_key"
      label: "Product Key"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations"
      hasUniqueValue: false
      description: "Product key/SKU associated with this Deal."

    - name: "opportunity_type"
      label: "Opportunity Type"
      type: "enumeration"
      fieldType: "select"
      groupName: "commercial_operations"
      options:
        - label: "MQL"
          value: "MQL"
        - label: "SQL"
          value: "SQL"
        - label: "FTP"
          value: "FTP"
        - label: "RTP"
          value: "RTP"
      description: "High-level pipeline bucket (MQL, SQL, FTP, RTP)."

    - name: "opportunity_state"
      label: "Opportunity State"
      type: "enumeration"
      fieldType: "select"
      groupName: "commercial_operations"
      options:
        - label: "Open"
          value: "Open"
        - label: "Lost"
          value: "Lost"
      description: "Commercial viability state (Open or Lost only; Deals never persist as Won)."

    - name: "opportunity_status"
      label: "Opportunity Status"
      type: "enumeration"
      fieldType: "select"
      groupName: "commercial_operations"
      options:
        - label: "New"
          value: "New"
        - label: "Working"
          value: "Working"
        - label: "Closed"
          value: "Closed"
      description: "Activity status (New, Working, Closed)."

    - name: "automation_suppressed"
      label: "Automation Suppressed"
      type: "boolean"
      fieldType: "booleancheckbox"
      groupName: "commercial_operations"
      options:
        - label: "True"
          value: "true"
        - label: "False"
          value: "false"
      description: "Master kill switch for Deal automation."

associationLabels:
  - fromObjectType: "deals"
    toObjectType: "contacts"
    category: "USER_DEFINED"
    labels:
      - name: "Decision Maker"
        typeId: 1001
      - name: "End User"
        typeId: 1002
      - name: "Influencer"
        typeId: 1003

pipelines:
  deals:
    - name: "B2B Pipeline"
      pipelineId: "b2b_pipeline"
      displayOrder: 1
      stages:
        - label: "Marketing Consent"
          stageId: "marketing_consent"
          displayOrder: 1
          probability: 0.1
        - label: "Demo Booking"
          stageId: "demo_booking"
          displayOrder: 2
          probability: 0.2
        - label: "Demo Confirmation"
          stageId: "demo_confirmation"
          displayOrder: 3
          probability: 0.3
        - label: "Demo Hosted"
          stageId: "demo_hosted"
          displayOrder: 4
          probability: 0.5
        - label: "Proposal Preparation"
          stageId: "proposal_preparation"
          displayOrder: 5
          probability: 0.6
        - label: "Commercial Agreement"
          stageId: "commercial_agreement"
          displayOrder: 6
          probability: 0.8
        - label: "Onboarding"
          stageId: "onboarding"
          displayOrder: 7
          probability: 0.9
        - label: "Renewal"
          stageId: "renewal"
          displayOrder: 8
          probability: 0.95

webhooks:
  targetUrl: "/webhooks/hubspot"
  subscriptions:
    - subscriptionType: "company.creation"
      enabled: true
    - subscriptionType: "company.propertyChange"
      propertyName: "company_key"
      enabled: true
    - subscriptionType: "deal.creation"
      enabled: true
    - subscriptionType: "deal.propertyChange"
      propertyName: "deal_key"
      enabled: true
    - subscriptionType: "contact.creation"
      enabled: true
