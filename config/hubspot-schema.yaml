version: "2026.03"
project: "hubspot-functions"

propertyGroups:
  - name: "commercial_operations_automation"
    label: "Commercial Operations Automation"
    objectTypes: ["companies", "deals", "contacts", "leads"]

properties:
  contacts:
    - name: "coa_relationship_key"
      label: "Relationship Key"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      hasUniqueValue: false
      description: "Canonical identity key for Commercial Relationship."

    - name: "coa_relationship_type"
      label: "Relationship Type"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      hasUniqueValue: false
      description: "Relationship Type category (b2b, b2c)."

    - name: "coa_marketing_consent"
      label: "Marketing Consent"
      type: "bool"
      fieldType: "booleancheckbox"
      groupName: "commercial_operations_automation"
      options:
        - label: "True"
          value: "true"
        - label: "False"
          value: "false"
      description: "Explicit marketing consent flag."

    - name: "coa_managed"
      label: "COA Managed"
      type: "bool"
      fieldType: "booleancheckbox"
      groupName: "commercial_operations_automation"
      description: "Whether record is managed by Commercial Operations Automation."

    - name: "coa_automation_suppressed"
      label: "Automation Suppressed"
      type: "bool"
      fieldType: "booleancheckbox"
      groupName: "commercial_operations_automation"
      description: "Master kill switch for Commercial Operations Automation."

    - name: "coa_config_version"
      label: "Config Version"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      description: "Version of Organization config evaluated."

  companies:
    - name: "coa_relationship_key"
      label: "Relationship Key"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      hasUniqueValue: false
      description: "Canonical identity key for Commercial Relationship."

    - name: "coa_relationship_type"
      label: "Relationship Type"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      hasUniqueValue: false
      description: "Relationship Type category (b2b, b2c)."

    - name: "coa_marketing_consent"
      label: "Marketing Consent"
      type: "bool"
      fieldType: "booleancheckbox"
      groupName: "commercial_operations_automation"
      options:
        - label: "True"
          value: "true"
        - label: "False"
          value: "false"
      description: "Explicit marketing consent flag."

    - name: "coa_managed"
      label: "COA Managed"
      type: "bool"
      fieldType: "booleancheckbox"
      groupName: "commercial_operations_automation"
      description: "Whether record is managed by Commercial Operations Automation."

    - name: "coa_automation_suppressed"
      label: "Automation Suppressed"
      type: "bool"
      fieldType: "booleancheckbox"
      groupName: "commercial_operations_automation"
      description: "Master kill switch for Commercial Operations Automation."

    - name: "coa_config_version"
      label: "Config Version"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      description: "Version of Organization config evaluated."

  leads:
    - name: "coa_opportunity_key"
      label: "Opportunity Key"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      hasUniqueValue: true
      description: "Canonical identity key for Lead Qualification Opportunity."

    - name: "coa_relationship_key"
      label: "Relationship Key"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      hasUniqueValue: false
      description: "Canonical relationship key."

    - name: "coa_relationship_type"
      label: "Relationship Type"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      hasUniqueValue: false
      description: "Relationship Type category (b2b, b2c)."

    - name: "coa_opportunity_type"
      label: "Opportunity Type"
      type: "enumeration"
      fieldType: "select"
      groupName: "commercial_operations_automation"
      options:
        - label: "MQL"
          value: "MQL"
        - label: "SQL"
          value: "SQL"
      description: "Qualification Opportunity Type (MQL or SQL)."

    - name: "coa_offering_keys"
      label: "Offering Keys"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      description: "Comma-separated list of commercial offering keys."

    - name: "coa_cycle_index"
      label: "Cycle Index"
      type: "number"
      fieldType: "number"
      groupName: "commercial_operations_automation"
      description: "Cycle sequence index for opportunities."

    - name: "coa_predecessor_opportunity_key"
      label: "Predecessor Opportunity Key"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      description: "Opportunity key of preceding completed opportunity."

    - name: "coa_qualification_state"
      label: "Qualification State"
      type: "enumeration"
      fieldType: "select"
      groupName: "commercial_operations_automation"
      options:
        - label: "PENDING"
          value: "PENDING"
        - label: "SATISFIED"
          value: "SATISFIED"
        - label: "BLOCKED"
          value: "BLOCKED"
        - label: "MANUAL_REVIEW"
          value: "MANUAL_REVIEW"
      description: "Current qualification state evaluated by commercial kernel."

    - name: "coa_unsatisfied_goal_keys"
      label: "Unsatisfied Goal Keys"
      type: "string"
      fieldType: "textarea"
      groupName: "commercial_operations_automation"
      description: "JSON array of unsatisfied goal keys."

    - name: "coa_last_evaluated_at"
      label: "Last Evaluated At"
      type: "datetime"
      fieldType: "date"
      groupName: "commercial_operations_automation"
      description: "Timestamp of last commercial kernel evaluation."

    - name: "coa_config_version"
      label: "Config Version"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      description: "Version of Organization config evaluated."

    - name: "coa_managed"
      label: "COA Managed"
      type: "bool"
      fieldType: "booleancheckbox"
      groupName: "commercial_operations_automation"
      description: "Whether record is managed by Commercial Operations Automation."

    - name: "coa_automation_suppressed"
      label: "Automation Suppressed"
      type: "bool"
      fieldType: "booleancheckbox"
      groupName: "commercial_operations_automation"
      description: "Master kill switch for Commercial Operations Automation."

  deals:
    - name: "coa_opportunity_key"
      label: "Opportunity Key"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      hasUniqueValue: true
      description: "Canonical identity key for Transaction Opportunity."

    - name: "coa_relationship_key"
      label: "Relationship Key"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      hasUniqueValue: false
      description: "Canonical relationship key."

    - name: "coa_relationship_type"
      label: "Relationship Type"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      hasUniqueValue: false
      description: "Relationship Type category (b2b, b2c)."

    - name: "coa_opportunity_type"
      label: "Opportunity Type"
      type: "enumeration"
      fieldType: "select"
      groupName: "commercial_operations_automation"
      options:
        - label: "FTP"
          value: "FTP"
        - label: "RTP"
          value: "RTP"
      description: "Transaction Opportunity Type (FTP or RTP)."

    - name: "coa_offering_keys"
      label: "Offering Keys"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      description: "Comma-separated list of commercial offering keys."

    - name: "coa_cycle_index"
      label: "Cycle Index"
      type: "number"
      fieldType: "number"
      groupName: "commercial_operations_automation"
      description: "Cycle sequence index for RTP opportunities."

    - name: "coa_predecessor_opportunity_key"
      label: "Predecessor Opportunity Key"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      description: "Opportunity key of preceding completed opportunity."

    - name: "coa_predecessor_completed_at"
      label: "Predecessor Completed At"
      type: "datetime"
      fieldType: "date"
      groupName: "commercial_operations_automation"
      description: "Completion timestamp of preceding completed opportunity."

    - name: "coa_qualification_state"
      label: "Qualification State"
      type: "enumeration"
      fieldType: "select"
      groupName: "commercial_operations_automation"
      options:
        - label: "PENDING"
          value: "PENDING"
        - label: "SATISFIED"
          value: "SATISFIED"
        - label: "BLOCKED"
          value: "BLOCKED"
        - label: "MANUAL_REVIEW"
          value: "MANUAL_REVIEW"
      description: "Current qualification state evaluated by commercial kernel."

    - name: "coa_unsatisfied_goal_keys"
      label: "Unsatisfied Goal Keys"
      type: "string"
      fieldType: "textarea"
      groupName: "commercial_operations_automation"
      description: "JSON array of unsatisfied goal keys."

    - name: "coa_last_evaluated_at"
      label: "Last Evaluated At"
      type: "datetime"
      fieldType: "date"
      groupName: "commercial_operations_automation"
      description: "Timestamp of last commercial kernel evaluation."

    - name: "coa_config_version"
      label: "Config Version"
      type: "string"
      fieldType: "text"
      groupName: "commercial_operations_automation"
      description: "Version of Organization config evaluated."

    - name: "coa_managed"
      label: "COA Managed"
      type: "bool"
      fieldType: "booleancheckbox"
      groupName: "commercial_operations_automation"
      description: "Whether record is managed by Commercial Operations Automation."

    - name: "coa_automation_suppressed"
      label: "Automation Suppressed"
      type: "bool"
      fieldType: "booleancheckbox"
      groupName: "commercial_operations_automation"
      description: "Master kill switch for Commercial Operations Automation."

pipelines:
  leads:
    - name: "B2B Qualification Lead Pipeline"
      pipelineId: "b2b_qualification_lead_pipeline"
      displayOrder: 1
      stages:
        - label: "MQL"
          stageId: "mql"
          displayOrder: 1
        - label: "SQL"
          stageId: "sql"
          displayOrder: 2
        - label: "Qualified"
          stageId: "qualified"
          displayOrder: 3
        - label: "Disqualified"
          stageId: "disqualified"
          displayOrder: 4

  deals:
    - name: "B2B Transaction Deal Pipeline"
      pipelineId: "b2b_transaction_deal_pipeline"
      displayOrder: 1
      stages:
        - label: "Open"
          stageId: "open"
          displayOrder: 1
          metadata:
            probability: 0.20
        - label: "Closed Won"
          stageId: "closedwon"
          displayOrder: 2
          metadata:
            probability: 1.00
        - label: "Closed Lost"
          stageId: "closedlost"
          displayOrder: 3
          metadata:
            probability: 0.00
