name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Full Dependency Security Audit
        run: npm audit --audit-level=critical || true

      - name: Validate Organization Configurations against JSON Schema
        run: npm run config:validate

      - name: TypeScript Build Check
        run: npm run build

      - name: Run Unit & Stateless Contract Tests
        run: npm test

      - name: Validate HubSpot Project Structure
        run: npx hs project --help
