name: CI & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit (Production & Development Dependencies)
        run: npm audit --omit=dev

      - name: TypeScript Compilation Check
        run: npm run build

      - name: Run Vitest Test Suite
        run: npm test

      - name: Install HubSpot CLI
        run: npm install -g @hubspot/cli@latest

      - name: Validate HubSpot Project Schema & Metadata
        run: |
          if [ -n "$HUBSPOT_PERSONAL_ACCESS_KEY" ]; then
            hs project validate
          else
            echo "Skipping authenticated CLI project validate step in unauthenticated CI environment."
          fi
