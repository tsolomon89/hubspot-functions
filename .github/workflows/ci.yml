name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: hubspot_automation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Full Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Validate Organization Configurations against JSON Schema
        run: |
          npx ajv-cli validate -s config/schema/commercial-model.schema.json -d "config/organizations/*.yaml" --parser yaml || true

      - name: TypeScript Build Check
        run: npm run build

      - name: Run Unit, Contract & Integration Tests
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/hubspot_automation
        run: npm test

      - name: Setup HubSpot CLI
        run: npm install -g @hubspot/cli@latest

      - name: Validate HubSpot Project Structure
        run: hs project validate
